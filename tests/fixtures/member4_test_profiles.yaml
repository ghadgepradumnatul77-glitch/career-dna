version: "1.0"

# Synthetic deterministic test fixtures for Member-4 normalization pipeline.
# These are NOT real users; they are handcrafted vocabularies to verify
# that raw candidate terms normalize reliably to canonical skill IDs.

profiles:
  - id: ml_oriented
    description: "Synthetic ML-oriented candidate skill vocabulary"
    raw_skills:
      - "Python3"
      - "sklearn"
      - "pandas"
      - "numpy"
      - "PyTorch"
      - "Docker"
      - "Git"
      - "SQL"
      - "FastAPI"
    expected_canonical_skill_ids:
      - "python"
      - "scikit_learn"
      - "pandas"
      - "numpy"
      - "pytorch"
      - "docker"
      - "git"
      - "sql"
      - "fastapi"
    expected_unknown_terms: []

  - id: software_oriented
